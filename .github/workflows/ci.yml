name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets
      - name: build
        run: cargo build --release
      - name: 确认产物名
        shell: bash
        run: |
          if [ ! -f target/release/nwt ] && [ ! -f target/release/nwt.exe ]; then
            echo "缺少 nwt 二进制"; exit 1
          fi
