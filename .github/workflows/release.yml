name: Release

# 发布矩阵:只在 v* tag 上触发,与 CI(ci.yml)完全分离 —— 普通 push/PR
# 不会跑到这里,CI 坏了也不拖累发布,反之亦然。资产命名契约见
# spec #10 / docs/release.md,install.sh 与这里必须同步。
on:
  push:
    tags: ['v*']

# 建 Release、上传资产需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # 5 组合契约(spec #10 / docs/release.md 资产表,install.sh 的探测承诺):
      #   linux  x86_64  -> ubuntu-latest
      #   linux  aarch64 -> ubuntu-24.04-arm
      #   macos  x86_64  -> macos-13(Intel)
      #   macos  aarch64 -> macos-latest(Apple Silicon)
      #   windows x86_64 -> windows-latest(唯一 .zip)
      # 资产名不在这里写死:由下面「推导资产名」按 uname -m 归一后拼出,
      # 和 install.sh 的请求名同源;release 任务再通配符收齐全部资产。
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-13
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: 构建 release 二进制
        run: cargo build --release

      # 版本号 = tag 去掉 v 前缀(v0.1.0 -> 0.1.0)。
      # tag 与 Cargo.toml 的 version 一致性由发布者 checklist 把关
      # (spec #10:不引入构建期注入),这里只做非阻断提醒。
      - name: 提醒 tag 与 Cargo.toml 版本号对齐
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          ver="${tag#v}"
          cargo_ver="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$ver" != "$cargo_ver" ]; then
            echo "::notice::tag $tag 与 Cargo.toml 版本 $cargo_ver 不一致(不阻断发布)"
          fi

      # 拼资产名(契约):nwt_<版本>_<os>_<arch>.tar.gz / windows 出 .zip
      - name: 推导资产名
        id: vars
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          case "$RUNNER_OS" in
            Linux|macOS)
              case "$(uname -s)" in
                Linux)  asset_os=linux ;;
                Darwin) asset_os=macos ;;
                *) echo "不支持的 OS: $(uname -s)"; exit 1 ;;
              esac
              case "$(uname -m)" in
                x86_64|amd64)  asset_arch=x86_64 ;;
                aarch64|arm64) asset_arch=aarch64 ;;
                *) echo "不支持的架构: $(uname -m)"; exit 1 ;;
              esac
              ;;
            Windows)
              # R3 决定:Windows 只保证编译运行级,仅出 x86_64 包
              asset_os=windows
              asset_arch=x86_64
              ;;
            *) echo "不支持的 RUNNER_OS: $RUNNER_OS"; exit 1 ;;
          esac
          asset="nwt_${ver}_${asset_os}_${asset_arch}"
          ext="tar.gz"; [ "$asset_os" = "windows" ] && ext="zip"
          echo "asset=${asset}.${ext}" >> "$GITHUB_OUTPUT"
          echo "basename=${asset}" >> "$GITHUB_OUTPUT"
          echo "产物: ${asset}.${ext}"

      - name: 打包(unix:tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="${{ steps.vars.outputs.asset }}"
          mkdir -p stage
          cp target/release/nwt stage/nwt
          tar -C stage -czf "$asset" nwt

      - name: 打包(windows:zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "${{ steps.vars.outputs.asset }}"
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target\release\nwt.exe stage\nwt.exe
          Compress-Archive -Path stage\nwt.exe -DestinationPath $asset -Force

      # 校验和边车文件:<hash>  <资产名>(sha256sum 双列格式,
      # checksums.txt 由 release 任务拼接而成,用户可 sha256sum -c)
      - name: 生成 sha256 边车
        shell: bash
        run: |
          asset="${{ steps.vars.outputs.asset }}"
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: nwt-${{ steps.vars.outputs.basename }}
          path: |
            ${{ steps.vars.outputs.asset }}
            ${{ steps.vars.outputs.asset }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 收齐全部构建产物(5 组合)
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 拼接总校验和:所有边车原样合并即 sha256sum -c 可用的 checksums.txt
      - name: 汇总 checksums.txt
        shell: bash
        run: |
          cd dist
          cat nwt_*.sha256 > checksums.txt
          cat checksums.txt
          sha256sum -c checksums.txt

      - name: 创建 GitHub Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nwt_*.tar.gz
            dist/nwt_*.zip
            dist/checksums.txt
          generate_release_notes: true
