[package]
name = "warehousetui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "nw(Nous Warehouse 装配引擎)的交互式驾驶舱"
license = "MIT"

[[bin]]
name = "nwt"
path = "src/main.rs"

[dependencies]
ratatui = "=0.30.2"
crossterm = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
